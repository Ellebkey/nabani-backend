name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      environment:
        type: environment
        default: DEV
        required: true
        description: The environment to run the workflow for
env:
  ENVIRONMENT: ${{ github.event.inputs.environment }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
    - name: Install dependencies and build tsc
      env:
        NODE_OPTIONS: "--max-old-space-size=4096"
        CI: true
      run: |
        npm ci
        npm run deploy:prod
    - name: Bundle production node_modules
      run: |
        npm prune --omit=dev
        mv node_modules backend/node_modules
        tar -czf backend.tar.gz backend
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: backend.tar.gz
        retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: backend-build
    - name: Copy tarball via ssh
      uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        source: "backend.tar.gz"
        target: "/home/ellebkey/apps/nabani"
    - name: Deploy package to digitalocean
      uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
      env:
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.PORT }}
        envs: GITHUB_USERNAME, GITHUB_TOKEN
        command_timeout: 20m
        script: |
          ~/nabani-backend
